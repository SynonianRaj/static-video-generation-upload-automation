services:
  video-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portrait_video_studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=INFO
      - MAX_DURATION=60.0
      - MAX_CONCURRENT_RENDERS=2
      - OUTPUT_RETENTION_MINUTES=120
    volumes:
      - video_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  video_outputs:
