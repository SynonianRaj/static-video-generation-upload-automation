[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generator-studio"
version = "1.0.0"
description = "Production-ready 9:16 portrait video generator with gradients, typography, animated GIFs and music"
authors = [{ name = "Syno" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "pilmoji>=2.0.0",
    "emoji>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
video-gen = "cli:main"
video-gen-server = "server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
